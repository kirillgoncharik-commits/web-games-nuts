name: Cinder Shift Sprint 2 presentation
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cinder-sprint2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        if: matrix.revision == 'baseline'
        with:
          ref: 38468184f63637f53b14d369c5b656e9ac36ed04
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare comparable source and test driver
        run: |
          if [ '${{ matrix.revision }}' = baseline ]; then
            cp candidate/tests/sprint2-presentation.spec.ts baseline/tests/
            cp candidate/playwright.sprint2.config.ts baseline/
          fi
      - name: Build and record presentation, lifecycle and input
        working-directory: ${{ matrix.revision == 'baseline' && 'baseline' || 'candidate' }}
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          npm run build
          npx playwright test --config=playwright.sprint2.config.ts --output=test-results/sprint2 --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/sprint2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-sprint2-${{ matrix.revision }}
          path: |
            ${{ matrix.revision == 'baseline' && 'baseline' || 'candidate' }}/test-results
            candidate/dist/cinder-shift

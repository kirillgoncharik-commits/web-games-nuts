name: Cinder Shift full Foundry routes
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cinder-rework-routes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --config=playwright.route.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-foundry-full-routes
          path: test-results

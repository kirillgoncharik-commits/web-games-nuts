name: Package pinned Cinder preview
on: [push, create]
permissions:
  contents: write
concurrency:
  group: cinder-preview-export-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    if: github.ref == 'refs/heads/codex/cinder-rw2-preview-build'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5db28327c2ce1a23c14c6f8870453102312ef072
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Preserve a readable exact-source build
        shell: bash
        run: |
          mkdir -p qa-export/chunks
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const manifest=JSON.parse(await readFile('dist/cinder-shift/build-manifest.json','utf8'));
          const file=manifest.files.find(f=>/assets\/index-.*\.js$/.test(f.path)),content=await readFile('dist/cinder-shift/'+file.path,'utf8'),chunks=[];
          for(let n=0;n<content.length;n+=32000){const name=String(n/32000).padStart(3,'0')+'.txt';await writeFile('qa-export/chunks/'+name,content.slice(n,n+32000));chunks.push('qa-export/chunks/'+name);}
          await writeFile('qa-export/index.json',JSON.stringify({source:manifest.source_sha,js:file.path,chunks,manifest},null,2));
          JS
          export GIT_INDEX_FILE="$RUNNER_TEMP/cinder-export-index"
          git read-tree --empty
          git add -f dist/cinder-shift qa-export
          tree=$(git write-tree)
          commit=$(git -c user.name='Cinder QA' -c user.email='cinder-qa@users.noreply.github.com' commit-tree "$tree" -m 'Archive pinned RW2 preview build 5db28327c2ce1a23c14c6f8870453102312ef072')
          branch="qa/cinder-rw2-build-$GITHUB_RUN_ID"
          git push origin "$commit:refs/heads/$branch"
          echo "CINDER_BUILD_BRANCH=$branch"
          echo "CINDER_BUILD_COMMIT=$commit"

      - name: Render the exact-source compact challenge menu
        run: |
          npx playwright install --with-deps chromium || (sudo apt-get update && npx playwright install --with-deps chromium)
          npx playwright test tests/sprint2-details.spec.ts --grep='challenge choices' --output=test-results/compact-menus --reporter=line
      - name: Export compact menu contact sheet
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {readFile,readdir} from 'node:fs/promises';
          import path from 'node:path';
          import sharp from 'sharp';
          async function files(root){return(await Promise.all((await readdir(root,{withFileTypes:true})).map(e=>e.isDirectory()?files(path.join(root,e.name)):[path.join(root,e.name)]))).flat();}
          const paths=(await files('test-results/compact-menus')).filter(p=>p.endsWith('/challenges.png')).sort(),layers=[];
          if(paths.length!==3)throw Error('Expected three real menu captures');
          for(const [i,file]of paths.entries()){const left=i*480;layers.push({input:await sharp(file).resize(480,650,{fit:'contain',background:'#101823'}).png().toBuffer(),left,top:0});}
          const png=await sharp({create:{width:1440,height:650,channels:4,background:'#101823'}}).composite(layers).png({palette:true,colours:256}).toBuffer(),base64=png.toString('base64');
          for(let n=0;n<base64.length;n+=6000)console.log('CINDER_RW2_MENUS_'+String(n/6000).padStart(3,'0')+':'+base64.slice(n,n+6000));
          console.log('CINDER_RW2_MENUS_END bytes='+png.length);
          JS

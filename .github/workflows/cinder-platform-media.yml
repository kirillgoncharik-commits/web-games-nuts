name: Cinder Shift platform media
on:
  push:
    branches: [release/cinder-shift/media]
    paths:
      - scripts/capture-platform-media.mjs
      - art/platform-release-2026-11-19/**
      - .github/workflows/cinder-platform-media.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cinder-platform-media
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 003ffa91cec7f64b5b4c29c464c216bf5fd49865
          path: capture-game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capture-game/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: capture-game
      - run: npx playwright install --with-deps chromium
        working-directory: capture-game
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm run build:target -- itch
        working-directory: capture-game
        env:
          CINDER_GAMEPLAY_BASE_SHA: 836a04fbc8dc1cdb0d8dbbcba1ec0fc5b64034a5
      - run: node scripts/build-rework-harness.mjs
        working-directory: capture-game
        env:
          CINDER_TARGET: itch
      - name: Record the actual alpha.12 runtime and export portal files
        run: node scripts/capture-platform-media.mjs capture-game platform-media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-platform-media-${{ github.run_number }}-${{ github.run_attempt }}
          path: platform-media
          retention-days: 30

name: Cinder Shift reachable build curve
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cinder-build-curve-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sector-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sector: [cargo, foundry, archive, reactor]
        build: [weapon, movement, defence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Compare affordable build on full sector routes
        run: npx playwright test --config=playwright.route.config.ts tests/${{ matrix.sector }}-route.spec.ts
        env:
          RW1_ROUTE_BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-curve-${{ matrix.sector }}-${{ matrix.build }}
          path: test-results

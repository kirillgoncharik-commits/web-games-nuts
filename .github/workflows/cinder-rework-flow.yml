name: Cinder Shift rework combat flow
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cinder-rework-flow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  combat-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --config=playwright.rework-flow.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-rework-flow-${{ matrix.browser }}
          path: test-results

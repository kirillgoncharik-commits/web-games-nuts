name: Cinder Shift check
on: [push, pull_request]
concurrency:
  group: cinder-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start headless audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cinder_qa
          pactl set-default-sink cinder_qa
      - run: npm run build
      - run: npm run art:check
      - run: npm test -- --shard=${{ matrix.shard }}/6 --reporter=line,json
        env:
          CROSS_BROWSER: "1"
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-shift-regression-${{ matrix.shard }}
          path: |
            dist/cinder-shift
            test-results

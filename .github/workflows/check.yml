name: Cinder Shift check
on: [push, pull_request]
concurrency:
  group: cinder-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start headless audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cinder_qa
          pactl set-default-sink cinder_qa
      - run: npm run build
      - run: npm run art:check
      - run: npm test -- --max-failures=8
        env:
          CROSS_BROWSER: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-shift-m05a
          path: |
            dist/cinder-shift
            test-results

name: Cinder C01 published preview
on:
  push:
    branches: [codex/cinder-shift-c01-playtest]
    paths: [.github/workflows/cinder-c01-hosted.yml]
permissions:
  contents: read
jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify the published immutable A/B preview
        run: npx playwright test --config=playwright.c01.config.ts --reporter=line,json
        env:
          CINDER_BASE_URL: https://890683b6.nuts-games.pages.dev
          CINDER_EXPECTED_SOURCE_SHA: bf0284d82cdad24715d924f357a30eeea998c615
          CINDER_C01_MEDIA: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/c01-published.json
      - name: Print browser failure context
        if: failure()
        run: find test-results -name error-context.md -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-c01-published-${{ github.run_number }}
          path: test-results

name: Cinder Shift rework candidate
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cinder-rework-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run art:check
      - name: Verify reproducible room registry
        run: |
          node scripts/export-rework-registry.mjs
          git diff --exit-code -- docs/cinder-shift/rework-room-registry.json
      - run: npx playwright test tests/motion-art-model.spec.ts tests/world-environment-model.spec.ts tests/turret-model.spec.ts tests/combat-feedback.spec.ts tests/regulator-ballistics-model.spec.ts tests/aimed-guard-model.spec.ts tests/player-jump-model.spec.ts tests/projectile-clearing.spec.ts tests/rw1-b-model.spec.ts tests/rework-model.spec.ts tests/m05b1-model.spec.ts tests/new-modes-core.spec.ts tests/session-model.spec.ts
        env:
          CINDER_BASE_URL: http://127.0.0.1:4175
  encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start headless audio output
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=cinder_qa
          pactl set-default-sink cinder_qa
      - run: npm run build
      - name: Verify rendered motion, pause and reduced motion in all ten worlds
        run: npx playwright test --config=playwright.rework.config.ts --project=${{ matrix.browser }} tests/world-motion.spec.ts --output=test-results/world-motion
      - name: Verify final boss ballistics and defensive limits first
        run: npx playwright test --config=playwright.rework.config.ts --project=${{ matrix.browser }} tests/world-environment.spec.ts tests/cargo-turrets.spec.ts tests/cargo-jump-precision.spec.ts tests/rw1-final-combat.spec.ts --output=test-results/final-combat
      - name: Verify existing UI, equipment and combat feedback
        run: npx playwright test --config=playwright.rework.config.ts --project=${{ matrix.browser }} tests/rework-ui.spec.ts tests/cargo-equipment.spec.ts tests/archive-equipment.spec.ts tests/rw1-equipment.spec.ts tests/feedback-ui.spec.ts tests/aimed-guard.spec.ts --output=test-results/encounters
      - name: Verify explicit silence, warning restore and the real music slider
        run: npx playwright test --config=playwright.rework.config.ts --project=${{ matrix.browser }} tests/audio-settings.spec.ts tests/sprint2-details.spec.ts --grep 'music volume|real music slider' --output=test-results/audio-settings
      - name: Capture exact-source combat feedback contact sheet
        if: always() && matrix.browser == 'chromium'
        run: node scripts/report-feedback-evidence.mjs
      - name: Capture RW1 mechanics contact sheet
        if: always() && matrix.browser == 'chromium'
        run: node scripts/report-rw1-evidence.mjs
      - name: Capture marksman armor and counter
        if: always() && matrix.browser == 'chromium'
        run: node scripts/report-guard-evidence.mjs
      - name: Capture final ballistics and defence evidence
        if: always() && matrix.browser == 'chromium'
        run: node scripts/report-final-combat-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-shift-rework-${{ matrix.browser }}
          path: |
            dist/cinder-shift
            test-results

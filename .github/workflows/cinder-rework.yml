name: Cinder Shift rework candidate
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: cinder-rework-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run art:check
      - run: npx playwright test tests/rework-model.spec.ts tests/m05b1-model.spec.ts tests/new-modes-core.spec.ts tests/session-model.spec.ts
        env:
          CINDER_BASE_URL: http://127.0.0.1:4175
  encounters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --config=playwright.rework.config.ts --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-shift-rework-${{ matrix.browser }}
          path: |
            dist/cinder-shift
            test-results

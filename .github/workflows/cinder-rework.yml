name: Cinder Shift rework foundation
on:
  push:
    branches: [codex/cinder-shift-m-rework]
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npm run art:check
      - run: npx playwright test tests/rework-model.spec.ts tests/m05b1-model.spec.ts tests/new-modes-core.spec.ts tests/session-model.spec.ts
      - run: npx playwright test --config=playwright.rework.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-shift-rework-foundation
          path: |
            dist/cinder-shift
            test-results

name: Cinder Shift artifact
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: cinder-artifact-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Download the immutable alpha.3 comparison build
        uses: actions/download-artifact@v4
        with:
          name: cinder-shift-19-1
          path: qa-work/menu-before-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: kirillgoncharik-commits/web-games-nuts
          run-id: 43901074700
      - name: Capture the actual alpha.3 main screen for comparison
        run: |
          (cd qa-work/menu-before-artifact && sha256sum -c cinder-shift-artifact.sha256)
          mkdir -p qa-work/menu-before-site/games/cinder-shift
          tar -xzf qa-work/menu-before-artifact/cinder-shift-artifact.tar.gz -C qa-work/menu-before-site/games/cinder-shift
          CINDER_MENU_BASELINE_SITE=qa-work/menu-before-site node scripts/capture-menu-baseline.mjs
      - run: npm run build
      - name: Verify rendered motion, pause and reduced motion in all ten worlds
        run: npx playwright test --config=playwright.rework.config.ts --project=chromium tests/world-motion.spec.ts --output=test-results/world-motion
      - name: Verify reported Cargo turret encounters
        run: npx playwright test --config=playwright.rework.config.ts --project=chromium tests/factory-environment.spec.ts tests/cargo-turrets.spec.ts tests/world-environment.spec.ts --output=test-results/cargo-turrets
      - name: Verify explicit silence, warning restore and the real music slider
        run: npx playwright test --config=playwright.rework.config.ts --project=chromium tests/audio-settings.spec.ts tests/sprint2-details.spec.ts --grep 'music volume|real music slider' --output=test-results/audio-settings
      - name: Verify menu targets and layouts at all supported sizes
        run: npx playwright test tests/m04-layout.spec.ts tests/m05b1-ui.spec.ts --grep 'menus and battle fit|35 percent|menu map preparation fit' --output=test-results/menu-layouts
      - name: Verify printer, lamp and collision-safety models
        run: npx playwright test tests/world-environment-model.spec.ts --output=test-results/environment-models
        env:
          CINDER_BASE_URL: http://127.0.0.1:4175
      - name: Verify robot composition and static glow at all control sizes
        run: npx playwright test --config=playwright.rework.config.ts --project=chromium tests/rework-ui.spec.ts --grep 'ART-01' --output=test-results/menu-art
      - name: Report exact menu comparison images
        if: always()
        run: node scripts/report-menu-art.mjs
      - run: npx playwright test --config=playwright.sprint3.config.ts --project=chromium --output=test-results/sprint3
      - run: npx playwright test --config=playwright.final.config.ts --project=chromium tests/final-worlds.spec.ts --output=test-results/final-worlds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-runtime-checks
          path: test-results
  world-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        world: [c02-small-world, c03-adriatic-1986]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify all twenty rooms with ordinary input
        run: npx playwright test --config=playwright.final.config.ts --project=chromium tests/final-world-routes.spec.ts --grep '${{ matrix.world }}' --output=test-results/${{ matrix.world }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-route-${{ matrix.world }}
          path: test-results
  artifact:
    needs: [runtime-checks, world-routes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Hash this immutable artifact
        run: |
          tar -czf cinder-shift-artifact.tar.gz -C dist/cinder-shift .
          sha256sum cinder-shift-artifact.tar.gz > cinder-shift-artifact.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cinder-shift-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            cinder-shift-artifact.tar.gz
            cinder-shift-artifact.sha256
            dist/cinder-shift/build-manifest.json

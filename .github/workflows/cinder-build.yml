name: Cinder Shift artifact
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: cinder-artifact-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Capture the actual alpha.3 main screen for comparison
        run: |
          git fetch --depth=1 origin 469f9483925fd3126fedd4d905c1754e3e3bcf17
          git worktree add --detach /tmp/cinder-menu-before 469f9483925fd3126fedd4d905c1754e3e3bcf17
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/cinder-menu-before/node_modules
          (cd /tmp/cinder-menu-before && GITHUB_WORKFLOW='Menu baseline verification' npm run build)
          CINDER_MENU_BASELINE_CHECKOUT=/tmp/cinder-menu-before node scripts/capture-menu-baseline.mjs
      - run: npm run build
      - name: Verify reported Cargo turret encounters
        run: npx playwright test --config=playwright.rework.config.ts --project=chromium tests/cargo-turrets.spec.ts tests/world-environment.spec.ts --output=test-results/cargo-turrets
      - name: Verify printer, lamp and collision-safety models
        run: npx playwright test tests/world-environment-model.spec.ts --output=test-results/environment-models
        env:
          CINDER_BASE_URL: http://127.0.0.1:4175
      - name: Verify robot composition and static glow at all control sizes
        run: npx playwright test --config=playwright.rework.config.ts --project=chromium tests/rework-ui.spec.ts --grep 'ART-01' --output=test-results/menu-art
      - run: npx playwright test --config=playwright.sprint3.config.ts --project=chromium --output=test-results/sprint3
      - run: npx playwright test --config=playwright.final.config.ts --project=chromium tests/final-worlds.spec.ts --output=test-results/final-worlds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-runtime-checks
          path: test-results
  world-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    strategy:
      fail-fast: false
      matrix:
        world: [c02-small-world, c03-adriatic-1986]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verify all twenty rooms with ordinary input
        run: npx playwright test --config=playwright.final.config.ts --project=chromium tests/final-world-routes.spec.ts --grep '${{ matrix.world }}' --output=test-results/${{ matrix.world }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinder-route-${{ matrix.world }}
          path: test-results
  artifact:
    needs: [runtime-checks, world-routes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Hash this immutable artifact
        run: |
          tar -czf cinder-shift-artifact.tar.gz -C dist/cinder-shift .
          sha256sum cinder-shift-artifact.tar.gz > cinder-shift-artifact.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cinder-shift-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            cinder-shift-artifact.tar.gz
            cinder-shift-artifact.sha256
            dist/cinder-shift/build-manifest.json
